<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="'UTF-8" >
<title>Controles de Formulários</title>
</head>

<body>
<h1>Preferências</h1>
<form action="index.html" method="GET" ></form>

<label for="nome"> Nome:</label>
<input type="text" id="nome" name="nome" >
<br>

<p>Qual turno você prefere estudar?</p>
<input type="radio" name="turno" id="manha" value="manha" >
<label for="manha">Manhã</label> <br>

<input type="radio" name="turno" id="tarde" value="tarde" >
<label for="tarde">Tarde</label> <br>

<input type="radio" name="turno" id="noite" value="noite" >
<label for="noite">Noite</label> <br> 

<p>Quais áreas da tecnologia você tem interesse?</p>
<input type="checkbox" name="areas" id="programacao" value="programacao">
<label for="programacao">Programação</label> <br>

<input type="checkbox" name="areas" id="design" value="design">
<label for="design">Design</label> <br>

<input type="checkbox" name="areas" id="bancodedados" value="bancodedados">
<label for="bancodedados">Banco de Dados</label> <br>

<input type="checkbox" name="areas" id="redes" value="redes">
<label for="redes">Redes</label> <br>

<input type="color" name="cor" id="cor" value="cor">
<label for="cor"> Qual sua cor favorita? </label> <br>

<input type="range" name="avaliacao" id="avaliacao" value="avaliacao">
<label for="avaliacao"> Qual o seu nivel de satisfação? </label> <br>

<input type="time" name="tempo" id="tempo" value="tempo">
<label for="tempo"> Qual o seu horário preferido? </label> 
<br><br>

<label for="arquivo">Envie um arquivo</label> 
<br>
<input type="file" name="arquivo" id="arquivo" value="arquivo">
<br><br>

<input type="submit" value="Cadastrar" >
<input type="reset" value="Limpar" >
</body>
</html>
